<div class="ds-notification__details">
  <ds-icon class="ds-notification__icon" [name]="icon()" [size]="20" />

  <!-- Heading and subtitle wrap as one run of text rather than stacking. On a
       wide notification Carbon reads them as a sentence on one line; the wrap
       to two lines is the narrow case, not the intent. -->
  <div class="ds-notification__text">
    <p class="ds-notification__heading">{{ heading() }}</p>

    @if (subtitle()) {
      <p class="ds-notification__subtitle">{{ subtitle() }}</p>
    }

    <!-- For a body that is more than a sentence: a link to where the problem
         gets fixed, which is what Carbon asks for on an error. -->
    <ng-content />
  </div>
</div>

@if (!hideCloseButton()) {
  <button
    type="button"
    class="ds-notification__close"
    [attr.aria-label]="closeLabel()"
    (click)="closed.emit()"
  >
    <ds-icon name="close" [size]="20" />
  </button>
}

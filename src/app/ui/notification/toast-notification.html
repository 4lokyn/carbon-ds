<nine-am-icon class="nine-am-notification__icon" [name]="icon()" [size]="20" />

<div class="nine-am-notification__details">
  <p class="nine-am-notification__heading">{{ heading() }}</p>

  @if (subtitle()) {
    <p class="nine-am-notification__subtitle">{{ subtitle() }}</p>
  }

  <ng-content />

  @if (caption()) {
    <p class="nine-am-notification__caption">{{ caption() }}</p>
  }
</div>

@if (!hideCloseButton()) {
  <button
    type="button"
    class="nine-am-notification__close"
    [attr.aria-label]="closeLabel()"
    (click)="closed.emit()"
  >
    <nine-am-icon name="close" [size]="20" />
  </button>
}

<div class="ds-notification__details">
  <ds-icon class="ds-notification__icon" [name]="icon()" [size]="20" />

  <div class="ds-notification__text">
    <p class="ds-notification__heading" [id]="headingId">{{ heading() }}</p>

    @if (subtitle()) {
      <p class="ds-notification__subtitle" [id]="subtitleId">{{ subtitle() }}</p>
    }

    <ng-content />

    <!-- Toast only. Carbon gives the inline layout no room for it. -->
    @if (caption() && !inline()) {
      <p class="ds-notification__caption">{{ caption() }}</p>
    }
  </div>
</div>

@if (actionLabel()) {
  <button
    dsButton
    type="button"
    class="ds-notification__action"
    [kind]="actionKind()"
    size="sm"
    (click)="actionClicked.emit()"
  >
    {{ actionLabel() }}
  </button>
}

@if (!hideCloseButton()) {
  <button
    type="button"
    class="ds-notification__close"
    [attr.aria-label]="closeLabel()"
    (click)="closed.emit()"
  >
    <ds-icon name="close" [size]="20" />
  </button>
}

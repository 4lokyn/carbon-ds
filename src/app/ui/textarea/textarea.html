<div class="nine-am-textarea__label-wrapper">
  <label
    class="nine-am-textarea__label"
    [class.nine-am-visually-hidden]="hideLabel()"
    [for]="textareaId"
  >
    {{ label() }}
  </label>

  @if (counter(); as text) {
    <!-- aria-hidden: the native maxlength already stops input, and a live
         count read out on every keystroke is unusable. The limit belongs in
         the helper text, where it is announced once. -->
    <span class="nine-am-textarea__counter" aria-hidden="true">{{ text }}</span>
  }
</div>

<div class="nine-am-textarea__field-wrapper">
  <textarea
    class="nine-am-textarea__field"
    [id]="textareaId"
    [value]="value()"
    [rows]="rows()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [readOnly]="readOnly()"
    [attr.maxlength]="maxLength() ?? null"
    [attr.aria-invalid]="invalid() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    (input)="onInput($event)"
    (blur)="blurred.emit()"
  ></textarea>

  @if (statusIcon(); as icon) {
    <nine-am-icon class="nine-am-textarea__status" [name]="icon" />
  }

  @if (fluid() && message()) {
    <div class="nine-am-textarea__divider"></div>
  }
</div>

@if (message(); as text) {
  <div class="nine-am-textarea__requirement" [id]="messageId">{{ text }}</div>
} @else if (helperText()) {
  <div class="nine-am-textarea__helper" [id]="helperId">{{ helperText() }}</div>
}

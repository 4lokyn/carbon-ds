<!-- Two circles on one 100x100 grid: r=44 leaves room for the 10-wide stroke to
     sit inside the box instead of being clipped by it. The faint one is the
     track, the bright one is the arc that travels. -->
<svg [class]="spinnerClass()" viewBox="0 0 100 100">
  <circle class="ds-loading__background" cx="50%" cy="50%" r="44" />
  <circle class="ds-loading__stroke" cx="50%" cy="50%" r="44" />
</svg>

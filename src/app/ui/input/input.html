<!-- In the fluid variant this same element is absolutely positioned inside
     the field box. Same DOM, different CSS — a second template would be two
     places to fix every label bug. -->
<label
  class="nine-am-input__label"
  [class.nine-am-visually-hidden]="hideLabel()"
  [for]="inputId"
>
  {{ label() }}
</label>

<div class="nine-am-input__field-wrapper">
  <input
    class="nine-am-input__field"
    [id]="inputId"
    [type]="effectiveType()"
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [readOnly]="readOnly()"
    [attr.aria-invalid]="invalid() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    (input)="onInput($event)"
    (blur)="blurred.emit()"
  />

  @if (statusIcon(); as icon) {
    <nine-am-icon class="nine-am-input__status" [name]="icon" />
  }

  @if (isPassword()) {
    <button
      type="button"
      class="nine-am-input__reveal"
      [disabled]="disabled()"
      [attr.aria-label]="revealed() ? hidePasswordLabel() : showPasswordLabel()"
      [attr.aria-pressed]="revealed()"
      (click)="toggleReveal()"
    >
      <nine-am-icon [name]="revealed() ? 'view-off' : 'view'" />
    </button>
  }

  <!-- Fluid only. The field has no bottom border in that variant, so without
       this the message would sit flush against the value with nothing
       separating them. -->
  @if (fluid() && message()) {
    <div class="nine-am-input__divider"></div>
  }
</div>

<!-- One slot, not two. Carbon replaces the helper text with the requirement
     rather than stacking them: stacking moves every field below this one the
     instant it goes invalid. -->
@if (message(); as text) {
  <div class="nine-am-input__requirement" [id]="messageId">{{ text }}</div>
} @else if (helperText()) {
  <div class="nine-am-input__helper" [id]="helperId">{{ helperText() }}</div>
}

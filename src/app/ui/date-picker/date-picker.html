<label
  class="ds-date-picker__label"
  [class.ds-visually-hidden]="hideLabel()"
  [for]="inputId"
>
  {{ label() }}
</label>

<div
  class="ds-date-picker__field-wrapper"
  cdkOverlayOrigin
  #origin="cdkOverlayOrigin"
>
  <input
    #field
    class="ds-date-picker__field"
    type="text"
    autocomplete="off"
    [id]="inputId"
    [value]="text()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [readOnly]="readOnly()"
    [attr.aria-invalid]="invalid() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />

  @if (statusIcon(); as icon) {
    <ds-icon class="ds-date-picker__status" [name]="icon" />
  }

  <button
    type="button"
    class="ds-date-picker__trigger"
    [disabled]="disabled() || readOnly()"
    [attr.aria-label]="openCalendarLabel()"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
  >
    <ds-icon name="calendar" />
  </button>
</div>

@if (message(); as text) {
  <div class="ds-date-picker__requirement" [id]="messageId">{{ text }}</div>
} @else if (helperText()) {
  <div class="ds-date-picker__helper" [id]="helperId">{{ helperText() }}</div>
}

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="open()"
  [cdkConnectedOverlayPositions]="positions"
  [cdkConnectedOverlayScrollStrategy]="scrollStrategy"
  [cdkConnectedOverlayDisableClose]="true"
  (overlayOutsideClick)="onOutsideClick($event)"
  (overlayKeydown)="onOverlayKeydown($event)"
  (detach)="open.set(false)"
>
  <!-- The primitive goes on a plain div rather than a wrapper component:
       it only provides state, and the panel below picks that up by
       injection like every other directive inside. -->
  <div
    class="ds-date-picker__calendar"
    ngpDatePicker
    [ngpDatePickerDate]="value() ?? undefined"
    [ngpDatePickerMin]="min() ?? undefined"
    [ngpDatePickerMax]="max() ?? undefined"
    [ngpDatePickerDateDisabled]="dateDisabled()"
    [ngpDatePickerFirstDayOfWeek]="firstDayOfWeek()"
    (ngpDatePickerDateChange)="onPick($event)"
  >
    <ds-date-picker-panel
      [previousMonthLabel]="previousMonthLabel()"
      [nextMonthLabel]="nextMonthLabel()"
    />
  </div>
</ng-template>

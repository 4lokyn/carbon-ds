<div class="ds-pagination__group">
  <label class="ds-pagination__label" [for]="sizeId">{{ itemsPerPageLabel() }}</label>

  <div class="ds-pagination__select-wrap">
    <select
      class="ds-pagination__select"
      [id]="sizeId"
      [disabled]="disabled()"
      (change)="onPageSizeChange($event)"
    >
      @for (size of pageSizes(); track size) {
        <option [value]="size" [selected]="size === pageSize()">{{ size }}</option>
      }
    </select>
    <ds-icon class="ds-pagination__select-icon" name="chevron-down" />
  </div>

  <!-- countKnown(), not `total() as count`: a total of 0 is a known total, and
       an empty table must read "0–0 of 0 items" rather than falling through to
       the unknown-count wording. -->
  <span class="ds-pagination__range">
    @if (countKnown()) {
      {{ rangeLabel()(firstItem(), lastItem(), total() ?? 0) }}
    } @else {
      {{ rangeLabelUnknown()(firstItem(), lastItem()) }}
    }
  </span>
</div>

<div class="ds-pagination__group">
  @if (countKnown()) {
    <div class="ds-pagination__select-wrap">
      <label class="ds-visually-hidden" [for]="pageId">{{ pageSelectLabel() }}</label>
      <select
        class="ds-pagination__select"
        [id]="pageId"
        [disabled]="disabled()"
        (change)="onPageChange($event)"
      >
        @for (candidate of pageNumbers(); track candidate) {
          <option [value]="candidate" [selected]="candidate === page()">{{ candidate }}</option>
        }
      </select>
      <ds-icon class="ds-pagination__select-icon" name="chevron-down" />
    </div>

    <span class="ds-pagination__range">{{ pageCountLabel()(pageCount()) }}</span>
  } @else {
    <!-- No count, no list of pages to offer: a select of pages we cannot
         enumerate would be a control that lies. The number is text, and the
         chevrons are the only way to move. -->
    <span class="ds-pagination__range">{{ pageLabel()(page()) }}</span>
  }

  <button
    class="ds-pagination__nav"
    type="button"
    [attr.aria-label]="previousLabel()"
    [disabled]="disabled() || page() <= 1"
    (click)="goTo(page() - 1)"
  >
    <ds-icon name="chevron-left" />
  </button>

  <button
    class="ds-pagination__nav"
    type="button"
    [attr.aria-label]="nextLabel()"
    [disabled]="disabled() || onLastPage()"
    (click)="goTo(page() + 1)"
  >
    <ds-icon name="chevron-right" />
  </button>
</div>

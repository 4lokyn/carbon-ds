<label
  class="nine-am-select__label"
  [class.nine-am-visually-hidden]="hideLabel()"
  [for]="selectId"
>
  {{ label() }}
</label>

<div class="nine-am-select__field-wrapper">
  <select
    #select
    class="nine-am-select__field"
    [id]="selectId"
    [disabled]="disabled() || readOnly()"
    [attr.aria-invalid]="invalid() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    (change)="onChange($event)"
    (blur)="blurred.emit()"
  >
    <ng-content />
  </select>

  <!-- After the select in the DOM so the chevron cannot intercept the click
       that opens it; it is pointer-events:none as well, belt and braces. -->
  <nine-am-icon class="nine-am-select__arrow" name="chevron-down" />

  @if (statusIcon(); as icon) {
    <nine-am-icon class="nine-am-select__status" [name]="icon" />
  }

  @if (fluid() && message()) {
    <div class="nine-am-select__divider"></div>
  }
</div>

@if (message(); as text) {
  <div class="nine-am-select__requirement" [id]="messageId">{{ text }}</div>
} @else if (helperText()) {
  <div class="nine-am-select__helper" [id]="helperId">{{ helperText() }}</div>
}
